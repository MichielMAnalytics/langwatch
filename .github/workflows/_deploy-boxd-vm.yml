name: Boxd VM deploy (reusable)

# Reusable GitHub Actions workflow that deploys a branch of the calling
# repo to a boxd VM:
#   1. Exchange BOXD_API_KEY for a short-lived JWT against the boxd API
#   2. Resolve the VM id by name over gRPC
#   3. Exec `git fetch + checkout -B + <deploy-cmd>` on the VM
#   4. Smoke-test the public URL
#
# The caller decides what build/restart looks like via the `deploy-cmd`
# input — e.g. `npm install && npm run build && pm2 reload …`. The
# command runs on the VM with the repo as the working directory.
#
# Caller example: see deploy.yml in this folder.

on:
  workflow_call:
    inputs:
      vm-name:
        description: Boxd VM name
        type: string
        required: true
      api-host:
        description: Boxd API hostname (e.g. boxd.sh, boxd-stg.sh)
        type: string
        required: true
      public-host:
        description: Public hostname to smoke-test after deploy
        type: string
        required: true
      vm-repo-path:
        description: Absolute path to the repo clone on the VM
        type: string
        required: true
      deploy-branch:
        description: Git branch to deploy
        type: string
        required: true
      deploy-cmd:
        description: |
          Shell command to run on the VM after git checkout. Runs from
          the repo root. Typical contents: install deps, build, restart
          your process manager. Default reloads pm2 ecosystem.config.cjs.
        type: string
        required: false
        default: 'pm2 reload ecosystem.config.cjs --update-env'
      smoke-test-port:
        description: Public port used for the smoke test (HTTPS)
        type: string
        required: false
        default: '443'
    secrets:
      boxd-api-key:
        description: Long-lived boxd API key, exchanged for a JWT each run
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOXD_VM_NAME: ${{ inputs.vm-name }}
      BOXD_API_HOST: ${{ inputs.api-host }}
      BOXD_PUBLIC_HOST: ${{ inputs.public-host }}
      BOXD_VM_REPO_PATH: ${{ inputs.vm-repo-path }}
      BOXD_DEPLOY_BRANCH: ${{ inputs.deploy-branch }}
      BOXD_DEPLOY_CMD: ${{ inputs.deploy-cmd }}
    steps:
      - name: Install grpcurl
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/grpcurl.tar.gz \
            https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz
          tar -xzf /tmp/grpcurl.tar.gz -C /tmp grpcurl
          sudo mv /tmp/grpcurl /usr/local/bin/grpcurl

      - name: Exchange API key for JWT
        env:
          BOXD_API_KEY: ${{ secrets.boxd-api-key }}
        run: |
          set -euo pipefail
          BOXD_API_KEY="$(printf '%s' "${BOXD_API_KEY}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          jwt=$(curl -fsSL -X POST "https://${BOXD_API_HOST}/api/v1/auth/token" \
            -H 'Content-Type: application/json' \
            -d "{\"api_key\":\"$BOXD_API_KEY\"}" | jq -r .token)
          [[ -n "$jwt" && "$jwt" != "null" ]] || { echo "key exchange failed against ${BOXD_API_HOST}"; exit 1; }
          echo "::add-mask::$jwt"
          echo "BOXD_JWT=$jwt" >> "$GITHUB_ENV"

      - name: Resolve VM id
        run: |
          set -euo pipefail
          vm_id=$(grpcurl -plaintext -H "authorization: Bearer $BOXD_JWT" -d '{}' \
            "${BOXD_API_HOST}:9443" boxd.api.v1.BoxdApi/ListVms \
            | jq -r --arg name "$BOXD_VM_NAME" '.vms[] | select(.name==$name) | .vmId')
          [[ -n "$vm_id" ]] || { echo "VM '${BOXD_VM_NAME}' not found on ${BOXD_API_HOST}"; exit 1; }
          echo "BOXD_VM_ID=$vm_id" >> "$GITHUB_ENV"

      - name: Pull latest + run deploy command
        run: |
          set -euo pipefail
          # One-line so printf %q doesn't emit ANSI-C quoting that would
          # break the JSON round-trip through grpcurl. Source nvm — boxd
          # Exec spawns a non-interactive shell that does not read ~/.bashrc,
          # so nvm-managed `npm`/`node` aren't on PATH otherwise.
          inner="set -e; export NVM_DIR=\"\$HOME/.nvm\"; if [ -s \"\$NVM_DIR/nvm.sh\" ]; then . \"\$NVM_DIR/nvm.sh\"; fi; export PATH=\"\$HOME/.local/bin:\$PATH\"; cd ${BOXD_VM_REPO_PATH} && git fetch origin ${BOXD_DEPLOY_BRANCH} && git checkout -B ${BOXD_DEPLOY_BRANCH} origin/${BOXD_DEPLOY_BRANCH} && ${BOXD_DEPLOY_CMD} && echo \"deployed \$(git rev-parse --short HEAD)\""
          wrapped="bash -lc $(printf %q "$inner")"
          msg=$(jq -nc --arg vm "$BOXD_VM_ID" --arg cmd "$wrapped" '{vm_id:$vm,command:$cmd}')

          # Long --max-time because on small VMs `npm install + build` can
          # take several minutes. Retries on transient VM-unreachable.
          for attempt in 1 2 3 4 5; do
            if out=$(printf '%s' "$msg" | grpcurl -plaintext -emit-defaults -max-time 1500 \
              -H "authorization: Bearer $BOXD_JWT" -d @ \
              "${BOXD_API_HOST}:9443" boxd.api.v1.BoxdApi/Exec 2>&1); then
              echo "$out" | jq -s -r 'map(.data // "") | join("")' | base64 -d 2>/dev/null || true
              rc=$(echo "$out" | jq -s 'last.exitCode // 0')
              exit "$rc"
            fi
            if echo "$out" | grep -qE "connection to VM|Unavailable|No route to host"; then
              echo "transient VM-unreachable (attempt $attempt), retrying in $((attempt*3))s..."
              sleep $((attempt*3))
              continue
            fi
            echo "exec failed:"
            echo "$out"
            exit 1
          done
          echo "exec failed after retries"
          exit 1

      - name: Verify public URL
        run: |
          set -euo pipefail
          # 30 tries × 5s sleep = ~5min upper bound, exits at first 2xx/3xx.
          # Stacks with multi-step cold-starts (Prisma migrate + Zod codegen
          # + Vite/Next compile) routinely take 60–120s — the previous 10-try
          # ceiling was tripping false-fail on healthy deploys.
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://${BOXD_PUBLIC_HOST}/" --max-time 10 || true)
            echo "try $i: $code"
            if [[ "$code" =~ ^2[0-9][0-9]$ || "$code" =~ ^3[0-9][0-9]$ ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "${BOXD_PUBLIC_HOST} did not return a 2xx/3xx after ~5min"
          exit 1
