name: Deploy to boxd VM

# Calls the reusable boxd VM deploy workflow on push to main.
# Generated by the boxd-setup-deploy skill, customized for the LangWatch
# docker-compose dev stack — `restart init app` re-runs pnpm install,
# Prisma generate, Zod codegen, Prisma+ClickHouse migrations, and `pnpm
# dev`. DBs (postgres/redis/clickhouse) are intentionally left running
# so push-to-main does not wipe state.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-boxd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-boxd-vm.yml
    with:
      vm-name: langwatch-golden
      api-host: boxd.sh
      public-host: langwatch-golden.boxd.sh
      vm-repo-path: /home/boxd/langwatch
      deploy-branch: main
      deploy-cmd: 'APP_PORT=5560 docker compose -f compose.dev.yml restart init app'

    secrets:
      boxd-api-key: ${{ secrets.BOXD_API_KEY }}
