name: Deploy to boxd VM

# Calls the reusable boxd VM deploy workflow on push to main.
# Generated by the boxd-setup-deploy skill, customized for the LangWatch
# docker-compose dev stack. The actual install/restart logic lives in
# scripts/boxd-deploy.sh and varies by what changed in the push:
#   source-only       → no restart (Vite HMR via volume mount)
#   deps/schema/migr  → restart init app (re-runs install + migrations)
#   compose / env.ex  → force-recreate (re-reads env_file)
# DBs (postgres/redis/clickhouse) are intentionally left running so
# push-to-main does not wipe state.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-boxd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-boxd-vm.yml
    with:
      vm-name: langwatch-golden
      api-host: boxd.sh
      public-host: langwatch-golden.boxd.sh
      vm-repo-path: /home/boxd/langwatch
      deploy-branch: main
      deploy-cmd: 'bash scripts/boxd-deploy.sh'

    secrets:
      boxd-api-key: ${{ secrets.BOXD_API_KEY }}
